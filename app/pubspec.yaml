# Porte la version de Kass'Beer (.claude/version.json). Le numéro de build après « + »
# monte d'un à chaque version : il devient le versionCode Android (P7).
name: kass_beer
description: "Kass'Beer — recettes et brassins de bière amateur."
publish_to: "none"
version: 0.1.41+42

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # Figés en version exacte, celle du pubspec.lock de Kass'Dalle (compilé sous
  # Android) : les quatre paquets à code natif firebase_core, firebase_auth,
  # cloud_firestore et google_sign_in, plus flutter_riverpod et go_router. Ne sont
  # pas figés ici : package_info_plus (^10.2.2) et toutes les dépendances indirectes
  # (google_sign_in_android, *_platform_interface, *_web, riverpod…), que seul
  # pubspec.lock fixe. La famille FlutterFire monte ensemble, dans une seule
  # commande, et chaque paquet changé dans pubspec.lock est nommé au CHANGELOG.md
  # (CLAUDE.md, « Règles de code », P6).
  firebase_core: 4.15.0
  firebase_auth: 6.7.0
  cloud_firestore: 6.8.0
  google_sign_in: 7.2.0
  flutter_riverpod: 3.3.1
  go_router: 17.2.3

  # Version affichée dans le menu du compte, lue du paquet installé : aucune
  # constante de version dans le code.
  package_info_plus: ^10.2.2

  # Calculs de brassage : paquet Dart pur du dépôt (CLAUDE.md, P3), sans autre
  # dépendance ; rien n'est chargé au démarrage.
  brewing:
    path: ../brewing

  # Import et export de recettes BeerJSON et BeerXML : paquet Dart pur du dépôt
  # (ADR-005). Il ne fait rien avant un import ou un export, et rien ne part sur le
  # réseau. Il tire crypto (SHA-256 des doublons) et xml 7.0.1 (lecture du BeerXML),
  # déjà résolus ici en dépendances indirectes.
  exchange:
    path: ../exchange

  # Garde l'écran allumé pendant le jour de brassage (ADR-001). Figé en 1.8.2, à
  # installer avec package_info_plus 10 : les deux paquets partagent win32.
  wakelock_plus: 1.8.2

  # Sélecteurs de date et d'heure en français, heure sur 24 h (ADR-003).
  flutter_localizations:
    sdk: flutter

  # Bip de fin de minuteur sur le web (Web Audio). Déjà tiré par les paquets
  # firebase_*_web ; déclaré parce que app/lib/ l'importe.
  web: ^1.1.1

  # Courbe du relevé de fermentation (ADR-004). Version exacte : le changelog de la
  # 1.1.0 annonce une rupture d'API dans une version mineure. Importé par le seul
  # fichier trace_courbe.dart (P18).
  fl_chart: 1.3.0

  # Ouvre la modification livrée d'un ticket sur GitHub (ADR-006, avenant du
  # 2026-11-10) et la licence CC BY-SA 4.0 de « Sources des données » (ADR-005).
  # Version exacte : seules une adresse https sur github.com
  # (ticket_lien_github.dart) et l'adresse constante de la licence
  # (data_sources_screen.dart) sont ouvertes.
  url_launcher: 6.3.3

  # Callable answerTicketAnalysis d'Admin › Tickets (ADR-008, lot T3). Famille
  # FlutterFire : 6.5.0 est la version que résout firebase_core 4.15.0 (celle du
  # pubspec.lock de Kass'Dalle) ; elle monte avec firebase_core (P6). L'instance
  # FirebaseFunctions se construit au premier appel et reste mémorisée par le
  # dépôt des tickets : rien n'est chargé au démarrage.
  cloud_functions: 6.5.0

  # Capture d'écran jointe à un ticket (ADR-008, lot T6) : dépôt par putData et
  # lecture par getData, jamais d'URL de téléchargement. Famille FlutterFire :
  # 13.6.0 est la version que résout firebase_core 4.15.0 (celle du pubspec.lock
  # de Kass'Dalle, compilé sous Android) ; elle monte avec firebase_core (P6).
  # L'instance FirebaseStorage se construit au premier dépôt ou à la première
  # lecture et reste mémorisée par le dépôt des tickets : rien n'est chargé au
  # démarrage.
  firebase_storage: 13.6.0

  # Analyses des tickets en Markdown (ADR-008, lot T3, P33). Version exacte : le
  # rendu ne change qu'avec une montée relue. Importés par le seul fichier
  # section_analyses.dart : aucune image chargée, liens http et https seuls, aucun
  # HTML rendu.
  flutter_markdown_plus: 1.0.7
  markdown: 7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Firestore en mémoire pour les tests des dépôts de données : aucun émulateur, aucun
  # réseau. 4.2.0 suit l'API de cloud_firestore 6.7 et suivantes.
  fake_cloud_firestore: ^4.2.0
  # Minuteurs simulés : déjà tiré par flutter_test, déclaré parce qu'un test l'importe.
  fake_async: ^1.3.3

flutter:
  uses-material-design: true

  # Écran « Nouveautés » : généré par scripts/changelog-recent.mjs depuis
  # documentation/CHANGELOG.md, régénéré par la CI et deploy.yml avant chaque build.
  assets:
    - assets/changelog_recent.json
