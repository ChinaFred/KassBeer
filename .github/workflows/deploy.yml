name: Déploiement

# Déploie le web (Firebase Hosting), les règles et les index Firestore après une
# CI verte sur un push de main. Publie un nouvel APK sur Firebase App
# Distribution (groupe « brasseurs ») quand le numéro de build de
# app/pubspec.yaml dépasse celui de la dernière version publiée. Déploie les
# Cloud Functions (ADR-006) quand le commit change functions/, et à chaque
# lancement manuel.
#
# Six jobs, pour que le code compilé ne tourne jamais à côté d'un accès à
# Google Cloud :
#   gate             le commit est la tête de main ; change-t-il functions/ ? ;
#   plan             configuration présente, faut-il un nouvel APK ? (jeton Google, aucun build) ;
#   build            web et APK signé (secrets de signature, aucun jeton Google) ;
#   build-functions  npm ci, build et manifeste des fonctions (ni secret, ni jeton Google) ;
#   deploy           Hosting, règles, index, Functions, App Distribution (jeton Google,
#                    aucun build, aucun npm ci de functions/ ni code des fonctions exécuté :
#                    firebase-tools lit le manifeste functions.yaml au lieu de charger
#                    le code, P14) ;
#   tag              tag annoté vX.Y.Z sur le commit, après un déploiement réussi
#                    (jeton GitHub en contents: write, aucun accès à Google Cloud).
#
# Aucun secret lisible sur pull_request (P14) : ce workflow ne se déclenche que
# sur workflow_run et workflow_dispatch, toujours sur main. Google Cloud par
# Workload Identity Federation, sans clé JSON. Réglages à créer sur GitHub et
# Google Cloud : documentation/exigences-techniques.md, « CI et déploiement ».
#
# Toute modification de ce fichier se signale à l'utilisateur avant la fusion (P10).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Un déploiement à la fois, jamais interrompu en route.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Le jeton GitHub ne fait que lire le dépôt. Les jobs plan et deploy demandent en
# plus id-token: write, pour le jeton OIDC échangé auprès de Google Cloud. Le job
# tag seul reçoit contents: write, pour créer le tag.
permissions:
  contents: read

# Actions épinglées par SHA de commit, version en commentaire (voir ci.yml).

env:
  FLUTTER_VERSION: '3.44.6' # aligner sur ci.yml

jobs:
  gate:
    name: Commit à déployer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Automatique : CI verte, sur un push (pas une PR), de main, dans ce dépôt.
    # Manuel : sur main seulement ; le sélecteur de GitHub propose toutes les
    # branches, et aucune autre n'a de CI validée pour la production.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    outputs:
      sha: ${{ steps.tip.outputs.sha }}
      functions: ${{ steps.functions.outputs.deploy }}
    steps:
      - name: Le commit est la tête de main
        id: tip
        # Relancer une ancienne CI verte remettrait en ligne un web et des
        # règles périmés. Un commit dépassé laisse la place au suivant.
        env:
          WANTED: ${{ github.event.workflow_run.head_sha || github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/$REPO/commits/main" --jq .sha)
          if [ "$tip" != "$WANTED" ]; then
            echo "::notice::$WANTED n'est plus la tête de main ($tip) : rien à déployer."
            exit 0
          fi
          echo "sha=$WANTED" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.tip.outputs.sha != ''
        with:
          ref: ${{ steps.tip.outputs.sha }}
          # Le commit et son premier parent : le diff de la fusion sur main.
          fetch-depth: 2
          persist-credentials: false

      - name: Le commit change-t-il functions/ ?
        id: functions
        # Functions déployées seulement quand functions/** change (P14), ou sur un
        # lancement manuel : après un déploiement des Functions en échec, relancer
        # ce workflow à la main les redéploie. Un diff illisible déploie par prudence.
        if: steps.tip.outputs.sha != ''
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            deploy=true
          elif ! git cat-file -e HEAD^1 2>/dev/null; then
            echo "::warning::Premier parent du commit illisible : les Functions sont déployées."
            deploy=true
          elif ! files=$(git diff --name-only HEAD^1 HEAD -- functions/); then
            echo "::warning::Diff illisible : les Functions sont déployées."
            deploy=true
          elif [ -n "$files" ]; then
            deploy=true
          else
            deploy=false
          fi
          echo "Déploiement des Functions : $deploy."
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  plan:
    name: Configuration et APK à publier
    needs: gate
    if: needs.gate.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Variables et secrets vivent dans l'environnement « production », réservé à
    # main. Google Cloud n'accepte le jeton OIDC que de ce dépôt, sur main, dans
    # cet environnement, depuis ce fichier.
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      ready: ${{ steps.config.outputs.ready }}
      apk: ${{ steps.apk.outputs.build }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            app/pubspec.yaml
            app/firebase.env.example.json
          sparse-checkout-cone-mode: false

      - name: Configuration présente ?
        id: config
        # Variables obligatoires : les deux de Google Cloud, plus chaque clé de
        # app/firebase.env.example.json (la liste des --dart-define que lit
        # l'application). Tant que le projet Firebase n'existe pas, aucune n'est
        # posée : le déploiement s'arrête ici, en vert, avec une annonce. Une
        # configuration incomplète est une erreur.
        env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          doc="documentation/exigences-techniques.md, « CI et déploiement »"
          example="app/firebase.env.example.json"
          if ! keys=$(jq -er 'keys_unsorted[]' "$example"); then
            echo "::error::$example absent ou illisible : liste des variables Firebase inconnue."
            exit 1
          fi
          required="GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT FIREBASE_PROJECT_ID FIREBASE_ANDROID_APP_ID
            $keys"
          missing=""
          present=0
          names=$(printf '%s' "$required" | tr -s '[:space:]' '\n' | awk 'NF && !seen[$0]++')
          for name in $names; do
            if printf '%s' "$VARS_JSON" | jq -e --arg k "$name" '(.[$k] // "") | strings | length > 0' > /dev/null; then
              present=$((present + 1))
            else
              missing="$missing $name"
            fi
          done
          if [ "$present" -eq 0 ]; then
            echo "::notice::Déploiement non configuré : aucune variable de l'environnement production. Rien n'est déployé. Voir $doc."
            {
              echo "### Rien n'est déployé"
              echo
              echo "Aucune variable de configuration dans l'environnement \`production\`. Voir $doc."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$missing" ]; then
            echo "::error::Variables absentes de l'environnement production :$missing. Voir $doc."
            exit 1
          fi
          android_app_id=$(printf '%s' "$VARS_JSON" | jq -r '.FIREBASE_ANDROID_APP_ID')
          if ! printf '%s' "$android_app_id" | grep -qE '^1:[0-9]+:android:[0-9a-f]+$'; then
            echo "::error::FIREBASE_ANDROID_APP_ID n'a pas la forme 1:<numéro>:android:<hex> (console Firebase › Paramètres du projet)."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Version de app/pubspec.yaml
        id: version
        if: steps.config.outputs.ready == 'true'
        run: |
          raw=$(grep -m1 '^version:' app/pubspec.yaml | sed 's/^version:[[:space:]]*//' | tr -d '\r')
          if ! printf '%s' "$raw" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$'; then
            echo "::error::app/pubspec.yaml : version « $raw », attendue X.Y.Z+N."
            exit 1
          fi
          echo "Version : $raw."
          echo "version=$raw" >> "$GITHUB_OUTPUT"

      - name: Authentification Google Cloud (lecture d'App Distribution)
        id: auth
        if: steps.config.outputs.ready == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          # Un jeton de cinq minutes, en sortie d'étape seulement : ni fichier
          # d'identifiants, ni variable d'environnement pour les étapes suivantes.
          token_format: access_token
          access_token_lifetime: 300s
          create_credentials_file: false
          export_environment_variables: false

      - name: Faut-il un nouvel APK ?
        id: apk
        # Compare le numéro de build N (app/pubspec.yaml, X.Y.Z+N) au
        # buildVersion de la dernière version publiée sur App Distribution. P7
        # garantit que N monte d'un à chaque version. Une version publiée
        # expirée (150 jours) est republiée. Une réponse illisible arrête le
        # déploiement : aucune décision par défaut.
        if: steps.config.outputs.ready == 'true'
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          number=$(printf '%s' "$APP_ID" | cut -d: -f2)
          url="https://firebaseappdistribution.googleapis.com/v1/projects/$number/apps/$APP_ID/releases?pageSize=1"
          response="$RUNNER_TEMP/releases.json"
          code=$(curl -sS --max-time 60 -o "$response" -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" "$url")
          if [ "$code" != "200" ]; then
            echo "::error::API App Distribution : HTTP $code. Vérifier le rôle Firebase App Distribution Admin du compte de service et l'API firebaseappdistribution.googleapis.com."
            jq -r '.error.message // empty' "$response" 2>/dev/null | sed 's/^/::error::/' || echo "::error::Réponse non JSON."
            exit 1
          fi
          build="${VERSION#*+}"
          latest=$(jq -r '.releases[0].buildVersion // ""' "$response")
          expire=$(jq -r '.releases[0].expireTime // ""' "$response")
          if [ -z "$latest" ]; then
            echo "Aucune version publiée : construction de v$VERSION."
            decision=true
          elif ! printf '%s' "$latest" | grep -qE '^[0-9]+$'; then
            echo "::error::buildVersion publié illisible : « $latest »."
            exit 1
          elif [ "$build" -gt "$latest" ]; then
            echo "Publié : build $latest. app/pubspec.yaml : v$VERSION. Construction."
            decision=true
          elif [ -n "$expire" ] && [ "$(date -u -d "$expire" +%s)" -le "$(date -u +%s)" ]; then
            echo "Publié : build $latest, expiré le $expire. Nouvelle publication de v$VERSION."
            decision=true
          else
            echo "Publié : build $latest. app/pubspec.yaml : v$VERSION. APK publié conservé."
            decision=false
          fi
          rm -f "$response"
          echo "build=$decision" >> "$GITHUB_OUTPUT"

  build:
    name: Build web et APK
    needs: [gate, plan]
    if: needs.plan.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Environnement production pour les variables et les secrets de signature.
    # Pas de id-token : le build exécute le code des dépendances (pub, Gradle),
    # qui n'a pas à obtenir de jeton Google.
    environment: production
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - name: Libérer de la place sur le disque
        if: needs.plan.outputs.apk == 'true'
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/julia* \
            /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          # Le jeton GitHub ne reste pas dans .git/config, à portée des scripts
          # de build.
          persist-credentials: false

      - name: Secrets de signature présents
        # Avant le build : un secret absent arrête le workflow avant tout
        # déploiement.
        if: needs.plan.outputs.apk == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Secrets absents de l'environnement production :$missing. Impossible de signer l'APK. Voir documentation/exigences-techniques.md, « CI et déploiement »."
            exit 1
          fi

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Configuration Firebase (dart-define)
        # Les clés de firebase.env.example.json, et elles seules, reçoivent la
        # variable GitHub du même nom, puis passent à --dart-define-from-file.
        # Ce sont les valeurs publiques de configuration du client web et
        # Android, pas des secrets. Le job plan a vérifié qu'aucune ne manque.
        env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          jq --argjson vars "$VARS_JSON" \
            'with_entries(.value = ($vars[.key] // ""))' firebase.env.example.json \
            > "$RUNNER_TEMP/firebase-defines.json"
          echo "Clés transmises : $(jq -r 'keys | join(", ")' "$RUNNER_TEMP/firebase-defines.json")."

      - name: Dépendances
        run: flutter pub get

      - name: Asset des nouveautés
        # L'écran « Nouveautés » embarque les six dernières versions « fonctionnel »
        # du CHANGELOG.md, dans le web comme dans l'APK construit plus bas.
        working-directory: .
        run: node scripts/changelog-recent.mjs

      - name: Build web
        run: flutter build web --release --dart-define-from-file="$RUNNER_TEMP/firebase-defines.json"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: needs.plan.outputs.apk == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: Build de l'APK signé
        # La clé de release n'existe que dans ce job (P8) : décodée dans
        # $RUNNER_TEMP, key.properties écrit dans app/android/, les deux
        # supprimés à la sortie, réussite ou échec.
        if: needs.plan.outputs.apk == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/release-keystore.jks"
          properties="android/key.properties"
          trap 'rm -f "$keystore" "$properties"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            echo "storeFile=$keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$properties"
          flutter build apk --release --dart-define-from-file="$RUNNER_TEMP/firebase-defines.json"
          apk="build/app/outputs/flutter-apk/app-release.apk"
          [ -f "$apk" ] || { echo "::error::flutter build apk n'a pas produit $apk."; exit 1; }
          mkdir -p "$RUNNER_TEMP/apk"
          cp "$apk" "$RUNNER_TEMP/apk/app-release.apk"

      - name: Supprimer la configuration Firebase du runner
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-defines.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: app/build/web
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.plan.outputs.apk == 'true'
        with:
          name: apk
          path: ${{ runner.temp }}/apk/app-release.apk
          if-no-files-found: error
          retention-days: 1

  build-functions:
    name: Build des Functions et manifeste
    needs: [gate, plan]
    if: needs.plan.outputs.ready == 'true' && needs.gate.outputs.functions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Ni environnement, ni secret, ni id-token : npm ci, tsc et la découverte des
    # fonctions exécutent le code des dépendances, qui n'a pas à obtenir de jeton
    # Google (P14).
    permissions:
      contents: read
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Dépendances
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Manifeste des fonctions
        # firebase-functions écrit la liste des fonctions et de leurs réglages dans
        # functions.yaml. Le job deploy le lit au lieu de charger le code avec le
        # jeton Google (conditions relevées par ADR-005 dans firebase-tools 15.35.0).
        env:
          FUNCTIONS_CONTROL_API: 'true'
        run: |
          manifest="$PWD/functions.yaml"
          FUNCTIONS_MANIFEST_OUTPUT_PATH="$manifest" npx --no-install firebase-functions .
          endpoints_filter='
            def keys_with(f): [.endpoints | to_entries[] | select(.value | f) | .key];
            (keys_with(has("blockingTrigger") or has("taskQueueTrigger")) | length == 0)
            and ((keys_with(has("httpsTrigger")) - ["githubTicketWebhook"]) | length == 0)
            and ((keys_with(has("callableTrigger")) - ["answerTicketAnalysis"]) | length == 0)
            and ((keys_with((.httpsTrigger.invoker // []) | index("public") != null)) - ["githubTicketWebhook"] | length == 0)
            and ((.endpoints.githubTicketWebhook // null) | . == null or (.maxInstances == 5 and .timeoutSeconds == 60))
            and ((.endpoints.answerTicketAnalysis // null) | . == null or (.maxInstances == 2 and .timeoutSeconds == 60))
          '
          if ! jq -e "$endpoints_filter" "$manifest" > /dev/null; then
            echo "::error::Point d'accès hors de la liste fermée d'ADR-008, ou réglages différents (P25)."
            exit 1
          fi
          if ! jq -e '[.endpoints[] | select((.maxInstances // 0) < 1)] | length == 0' "$manifest" > /dev/null; then
            echo "::error::maxInstances manque sur une fonction (P25)."
            exit 1
          fi
          echo "Fonctions : $(jq -r '.endpoints | keys | join(", ")' "$manifest")."

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: functions
          # Le code compilé et le manifeste ; package.json et package-lock.json
          # viennent du checkout du job deploy. Cloud Build installe les dépendances
          # de production depuis package-lock.json, côté Google.
          path: |
            functions/lib
            functions/functions.yaml
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Hosting, règles, index, Functions, App Distribution
    needs: [gate, plan, build, build-functions]
    # build-functions est ignoré quand functions/ ne change pas : le déploiement part
    # quand même, sans les Functions.
    if: >-
      !cancelled() &&
      needs.plan.outputs.ready == 'true' &&
      needs.build.result == 'success' &&
      (needs.build-functions.result == 'success' ||
       (needs.build-functions.result == 'skipped' && needs.gate.outputs.functions != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Le commit est toujours la tête de main
        # Refait ici : « Re-run failed jobs » ne rejoue pas le job gate.
        env:
          WANTED: ${{ needs.gate.outputs.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/$REPO/commits/main" --jq .sha)
          if [ "$tip" != "$WANTED" ]; then
            echo "::error::$WANTED n'est plus la tête de main ($tip) : déploiement refusé."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rules-tests/package-lock.json

      - name: CLI Firebase verrouillée
        # Avant l'authentification : rien de ce qui s'installe ici ne tourne avec
        # le jeton Google. Version et dépendances verrouillées par
        # rules-tests/package-lock.json (firebase-tools, la même que les tests
        # des règles) ; --ignore-scripts n'exécute aucun script d'installation.
        # Seul « firebase » rejoint le PATH.
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix rules-tests
          mkdir -p "$RUNNER_TEMP/firebase-cli"
          ln -s "$GITHUB_WORKSPACE/rules-tests/node_modules/.bin/firebase" "$RUNNER_TEMP/firebase-cli/firebase"
          echo "$RUNNER_TEMP/firebase-cli" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/firebase-cli/firebase" --version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: app/build/web

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.apk == 'true'
        with:
          name: apk
          path: ${{ runner.temp }}/apk

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.gate.outputs.functions == 'true'
        with:
          name: functions
          path: functions

      - name: Manifeste des Functions contrôlé (P25)
        # Avant l'authentification : le manifeste vient d'un job qui exécute le code des
        # dépendances. Il est relu ici, par jq seul : points d'accès HTTP et callables
        # limités à la liste fermée d'ADR-008 (githubTicketWebhook seul public,
        # answerTicketAnalysis), avec leurs maxInstances et délais ; aucun déclencheur
        # bloquant ou de file ; maxInstances sur chaque fonction ; compte d'exécution
        # tickets-functions ; secrets : GITHUB_TICKETS_TOKEN, et GITHUB_WEBHOOK_SECRET
        # monté par githubTicketWebhook seul.
        if: needs.gate.outputs.functions == 'true'
        env:
          PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          manifest="functions/functions.yaml"
          if ! jq -e '.endpoints | type == "object" and length > 0' "$manifest" > /dev/null; then
            echo "::error::$manifest absent, illisible ou sans fonction."
            exit 1
          fi
          endpoints_filter='
            def keys_with(f): [.endpoints | to_entries[] | select(.value | f) | .key];
            (keys_with(has("blockingTrigger") or has("taskQueueTrigger")) | length == 0)
            and ((keys_with(has("httpsTrigger")) - ["githubTicketWebhook"]) | length == 0)
            and ((keys_with(has("callableTrigger")) - ["answerTicketAnalysis"]) | length == 0)
            and ((keys_with((.httpsTrigger.invoker // []) | index("public") != null)) - ["githubTicketWebhook"] | length == 0)
            and ((.endpoints.githubTicketWebhook // null) | . == null or (.maxInstances == 5 and .timeoutSeconds == 60))
            and ((.endpoints.answerTicketAnalysis // null) | . == null or (.maxInstances == 2 and .timeoutSeconds == 60))
          '
          if ! jq -e "$endpoints_filter" "$manifest" > /dev/null; then
            echo "::error::Point d'accès hors de la liste fermée d'ADR-008, ou réglages différents (P25)."
            exit 1
          fi
          if ! jq -e '[.endpoints[] | select((.maxInstances // 0) < 1)] | length == 0' "$manifest" > /dev/null; then
            echo "::error::maxInstances manque sur une fonction (P25)."
            exit 1
          fi
          if ! jq -e --arg full "tickets-functions@$PROJECT.iam.gserviceaccount.com" \
               '[.endpoints[] | select(.serviceAccountEmail != $full)] | length == 0' "$manifest" > /dev/null; then
            echo "::error::Une fonction ne tourne pas sous le compte tickets-functions."
            exit 1
          fi
          secrets_filter='
            ([.endpoints | to_entries[] | .key as $f | (.value.secretEnvironmentVariables // [])[] | .key
              | select(. != "GITHUB_TICKETS_TOKEN" and (. != "GITHUB_WEBHOOK_SECRET" or $f != "githubTicketWebhook"))] | length == 0)
            and ([(.params // [])[] | select(.type == "secret" and .name != "GITHUB_TICKETS_TOKEN" and .name != "GITHUB_WEBHOOK_SECRET")] | length == 0)
          '
          if ! jq -e "$secrets_filter" "$manifest" > /dev/null; then
            echo "::error::Une fonction lit un secret autre que GITHUB_TICKETS_TOKEN, ou GITHUB_WEBHOOK_SECRET hors de githubTicketWebhook."
            exit 1
          fi
          echo "Manifeste conforme : $(jq -r '.endpoints | keys | join(", ")' "$manifest")."

      - name: Authentification Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        # Workload Identity Federation, aucune clé JSON (P14). Le fichier
        # d'identifiants créé ici ne contient que la configuration d'échange du
        # jeton OIDC ; firebase-tools le lit par GOOGLE_APPLICATION_CREDENTIALS.
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Déployer Hosting, règles et index Firestore
        # Un code 0 ne prouve pas que la CLI a déployé : le succès exige aussi
        # « Deploy complete » dans sa sortie. Pas de --force : il supprimerait
        # les index absents de firestore.indexes.json.
        env:
          PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          log="$RUNNER_TEMP/firebase-deploy.log"
          set -o pipefail
          firebase deploy --only hosting,firestore:rules,firestore:indexes \
            --project "$PROJECT" --non-interactive 2>&1 | tee "$log"
          if ! grep -q "Deploy complete" "$log"; then
            echo "::error::firebase deploy a rendu 0 sans « Deploy complete » : rien ne prouve le déploiement."
            exit 1
          fi

      - name: Déployer les Functions
        # Sans npm ci ni build ici (P14) : functions/lib et functions/functions.yaml
        # viennent du job build-functions. Le predeploy de firebase.json vérifie leur
        # présence. firebase-tools lit functions.yaml et ne charge pas le code. Pas de
        # --force : une fonction retirée du code n'est pas supprimée sans geste exprès.
        if: needs.gate.outputs.functions == 'true'
        env:
          PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          log="$RUNNER_TEMP/firebase-deploy-functions.log"
          set -o pipefail
          firebase deploy --only functions \
            --project "$PROJECT" --non-interactive 2>&1 | tee "$log"
          if ! grep -q "Deploy complete" "$log"; then
            echo "::error::firebase deploy --only functions a rendu 0 sans « Deploy complete » : rien ne prouve le déploiement."
            exit 1
          fi

      - name: Publier l'APK sur App Distribution
        if: needs.plan.outputs.apk == 'true'
        env:
          APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
          PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          notes="$RUNNER_TEMP/release-notes.txt"
          # Entrée de cette version dans le CHANGELOG.md (titres « fonctionnel »
          # et « technique »), jusqu'au titre d'une autre version ou d'une autre date.
          {
            echo "Kass'Beer v$VERSION ($(git rev-parse --short HEAD))"
            echo
            awk -v v="### v${VERSION%%+*} " '
              /^## / && seen { exit }
              /^### v/ { if (index($0, v) == 1) { seen = 1; print; next } else if (seen) exit }
              seen' documentation/CHANGELOG.md
          } > "$notes"
          firebase appdistribution:distribute "$RUNNER_TEMP/apk/app-release.apk" \
            --app "$APP_ID" --groups brasseurs --release-notes-file "$notes" \
            --project "$PROJECT" --non-interactive

      - name: Résumé
        env:
          APK: ${{ needs.plan.outputs.apk }}
          FUNCTIONS: ${{ needs.gate.outputs.functions }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          {
            echo "### Déployé : v$VERSION ($(git rev-parse --short HEAD))"
            echo
            echo "Web (Hosting), règles et index Firestore."
            if [ "$FUNCTIONS" = true ]; then
              echo "Cloud Functions des tickets."
            else
              echo "Functions inchangées : functions/ n'a pas changé."
            fi
            if [ "$APK" = true ]; then
              echo "Nouvel APK publié sur App Distribution, groupe « brasseurs »."
            else
              echo "APK inchangé : le numéro de build publié est à jour."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  tag:
    name: Tag de la version déployée
    needs: [gate, plan, deploy]
    # Seulement après un déploiement réussi : une version qui n'est pas en ligne
    # ne reçoit pas de tag. Sur workflow_run, le workflow démarre à la fin d'une CI
    # verte de ce commit ; sur un lancement manuel, le script vérifie que la CI
    # `push` du commit est finie et verte, sinon le tag ferait échouer
    # check-version.mjs sur cette CI (leçon 16).
    # !cancelled() : sans lui, la condition implicite success() est fausse dès qu'un job
    # en amont est ignoré (build-functions quand functions/ ne change pas), et le tag
    # n'est jamais posé (run 20, v0.1.18).
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Seul job qui écrit sur le dépôt : créer le tag par l'API, avec le jeton
    # GitHub du run. Ni id-token, ni environnement, ni secret, ni extraction du
    # code, ni dépendance (P14).
    permissions:
      contents: write
    steps:
      - name: Poser le tag annoté vX.Y.Z sur le commit déployé
        env:
          SHA: ${{ needs.gate.outputs.sha }}
          RAW: ${{ needs.plan.outputs.version }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RAW%%+*}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version « $RAW » illisible : aucun tag posé."
            exit 1
          fi
          tag="v$version"

          # Lancement manuel : le tag n'est posé qu'après la CI verte du commit.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            ci=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&per_page=1" \
              --jq '.workflow_runs[0] | "\(.status) \(.conclusion)"')
            if [ "$ci" != "completed success" ]; then
              echo "::warning::CI de $SHA pas encore verte (« $ci ») : aucun tag posé. Relancer ce workflow après la CI verte."
              exit 0
            fi
          fi

          # Tag déjà présent (déploiement relancé, ou tag posé depuis un poste) :
          # rien à faire. Un tag poussé ne se déplace pas (CLAUDE.md). Seul un 404
          # veut dire « absent » ; toute autre erreur de l'API fait échouer le job.
          err="$RUNNER_TEMP/tag-ref.err"
          if ref=$(gh api "repos/$REPO/git/ref/tags/$tag" 2>"$err"); then
            type=$(jq -r .object.type <<<"$ref")
            target=$(jq -r .object.sha <<<"$ref")
            if [ "$type" = "tag" ]; then
              target=$(gh api "repos/$REPO/git/tags/$target" --jq .object.sha)
            fi
            if [ "$target" = "$SHA" ]; then
              echo "Le tag $tag existe déjà sur $SHA."
            else
              echo "::warning::Le tag $tag existe déjà sur $target, pas sur $SHA : il n'est pas déplacé."
            fi
            exit 0
          elif ! grep -q 'HTTP 404' "$err"; then
            cat "$err" >&2
            echo "::error::Lecture du tag $tag impossible : aucun tag posé."
            exit 1
          fi

          object=$(gh api "repos/$REPO/git/tags" \
            -f tag="$tag" -f message="$tag" -f object="$SHA" -f type=commit \
            -f 'tagger[name]=github-actions[bot]' \
            -f 'tagger[email]=41898282+github-actions[bot]@users.noreply.github.com' \
            --jq .sha)
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$object" --silent
          echo "Tag $tag posé sur $SHA."
          echo "### Tag $tag posé sur \`${SHA:0:7}\`" >> "$GITHUB_STEP_SUMMARY"
