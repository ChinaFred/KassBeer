name: CI

# Contrôles du projet (CLAUDE.md, « Commandes utiles »), rejoués sur chaque pull
# request et chaque push de branche. Une PR dont la CI n'est pas verte ne se
# fusionne pas, et deploy.yml ne part qu'après une CI verte sur un push de main.
#
# Cinq jobs : Version, Flutter et brewing/, Règles (émulateur), Functions (lint,
# build, tests, manifeste des fonctions), Android (compilation de l'APK quand le diff
# touche app/pubspec.yaml, app/pubspec.lock ou app/android/). Pas de job « déjà testé
# en PR » : le push de fusion rejoue tout.
#
# Aucun secret ici (P14) : la CI lit le dépôt, compile et teste. L'APK du job
# Android est signé par une clé jetable générée dans le job.
#
# Toute modification de ce fichier se signale à l'utilisateur avant la fusion (P10).

on:
  pull_request:
  push:
    # Toutes les branches, pas les tags : le tag vX.Y.Z posé après la fusion
    # ne relance rien.
    branches: ['**']
  workflow_dispatch:

# Un nouveau push annule le run en cours de la même branche (ou de la même PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions épinglées par SHA de commit, version en commentaire : une étiquette se
# déplace, un SHA ne change pas de contenu. Toutes les actions tournent sous Node 24
# depuis la v0.1.6. Monter de version : lire les notes de version, puis
# `gh api repos/<action>/git/ref/tags/<tag>` pour le SHA.

env:
  FLUTTER_VERSION: '3.44.6' # aligner sur .claude/hooks/setup-projet.sh

jobs:
  version:
    name: Version et outillage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-version.mjs compare HEAD à la branche principale : il lui faut
          # l'historique et les branches distantes.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Tags du dépôt
        # check-version.mjs refuse un numéro dont le tag existe déjà.
        run: git fetch --tags --force --quiet origin

      - name: Version supérieure à la branche principale
        # Sur une PR : HEAD est le commit de fusion préparé par GitHub, comparé à
        # la base de la PR telle qu'elle est maintenant.
        # Sur un push de main : comparé à la main d'avant le push.
        # Sur un push d'une autre branche : comparé à origin/main (ce qui sera
        # fusionné). Une branche de travail qui n'a pas encore incrémenté sa
        # version est donc rouge à ce job.
        # Un lancement manuel n'a pas de base : le contrôle ne tourne pas.
        if: github.event_name != 'workflow_dispatch'
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --quiet origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            node scripts/check-version.mjs --base "origin/$BASE_REF"
          elif [ "$REF_NAME" = "main" ] && [ -n "$BEFORE" ] \
               && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            node scripts/check-version.mjs --base "$BEFORE"
          else
            node scripts/check-version.mjs
          fi

      - name: Agents et skills chargeables
        # Claude Code écarte sans message un agent ou un skill dont l'en-tête
        # YAML est invalide.
        run: node scripts/check-agents.mjs

      - name: Tests des scripts
        # Dont scripts/changelog-recent.test.mjs (écran « Nouveautés »).
        run: node --test scripts/*.test.mjs

  flutter:
    name: Flutter et brewing — analyse, format, tests, build web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: brewing — dépendances
        working-directory: brewing
        run: dart pub get

      - name: brewing — pubspec.lock à jour
        working-directory: brewing
        run: git diff --exit-code pubspec.lock

      - name: brewing — analyse statique
        # Strict : erreurs, avertissements et infos bloquent.
        working-directory: brewing
        run: dart analyze --fatal-infos

      - name: brewing — format
        working-directory: brewing
        run: dart format --output=none --set-exit-if-changed .

      - name: brewing — tests (fixtures des 16 fiches)
        working-directory: brewing
        run: dart test

      - name: app — dépendances
        working-directory: app
        run: flutter pub get

      - name: app — pubspec.lock à jour
        # Un pubspec.lock désynchronisé : la CI et le poste ne compilent pas la
        # même chose.
        working-directory: app
        run: git diff --exit-code pubspec.lock

      - name: app — asset des nouveautés
        # Régénère app/assets/changelog_recent.json depuis CHANGELOG.md avant les
        # tests et le build web : la copie versionnée ne sert qu'aux builds locaux.
        run: node scripts/changelog-recent.mjs

      - name: app — analyse statique
        working-directory: app
        run: flutter analyze

      - name: app — format
        working-directory: app
        run: dart format --output=none --set-exit-if-changed lib test

      - name: app — tests
        working-directory: app
        run: flutter test

      - name: app — build web (sans configuration Firebase)
        # Aucune --dart-define : l'application compile avec des valeurs vides.
        # Le build déployé reçoit la configuration dans deploy.yml.
        working-directory: app
        run: flutter build web --release

  rules:
    name: Règles — émulateur
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rules-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rules-tests/package-lock.json

        # L'émulateur Firestore tourne sur la JVM ; firebase-tools 15 exige Java 21.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

        # Binaires de l'émulateur, téléchargés par firebase-tools au premier
        # lancement. La clé suit la version verrouillée de firebase-tools.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('rules-tests/package-lock.json') }}

      - name: Dépendances
        run: npm ci --no-audit --no-fund

      - name: Tests de firestore.rules
        # Projet fictif demo-kassbeer : aucun contact avec la production (P4).
        run: npm test

  functions:
    name: Functions — lint, build, tests
    # Cloud Functions des tickets (ADR-006). Aucun secret, aucun accès à Google Cloud :
    # le job installe, analyse, compile, teste, puis produit le manifeste des fonctions
    # comme le fera deploy.yml, et vérifie P25 sur ce manifeste.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Dépendances
        run: npm ci --no-audit --no-fund

      - name: Lint et format (ESLint, Prettier)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

      - name: Manifeste des fonctions (P25)
        # Même découverte que deploy.yml. Aucun point d'accès HTTP ni callable, et
        # maxInstances posé sur chaque fonction.
        env:
          FUNCTIONS_CONTROL_API: 'true'
        run: |
          manifest="$RUNNER_TEMP/functions.yaml"
          FUNCTIONS_MANIFEST_OUTPUT_PATH="$manifest" npx --no-install firebase-functions .
          jq -r '.endpoints | keys[]' "$manifest"
          if ! jq -e '[.endpoints[] | select(has("httpsTrigger") or has("callableTrigger") or has("blockingTrigger") or has("taskQueueTrigger"))] | length == 0' "$manifest" > /dev/null; then
            echo "::error::Une fonction expose un point d'accès HTTP ou une callable : interdit sans ADR (P25)."
            exit 1
          fi
          if ! jq -e '[.endpoints[] | select((.maxInstances // 0) < 1)] | length == 0' "$manifest" > /dev/null; then
            echo "::error::maxInstances manque sur une fonction (P25)."
            exit 1
          fi

  android:
    name: Android — compilation
    # Le job Flutter ne compile que le web. Une dépendance qui ne compile qu'en
    # Java ou en Kotlin passe les tests et casse la livraison de l'APK (leçon 4,
    # P6). Ce job compile l'APK release quand le diff touche app/pubspec.yaml,
    # app/pubspec.lock ou app/android/, et toujours sur un lancement manuel.
    runs-on: ubuntu-latest
    # Un Gradle bloqué occuperait sinon le runner jusqu'à 360 min.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Le diff se calcule contre la base de la PR ou la branche d'avant le push.
          fetch-depth: 0

      - name: Le diff touche-t-il Android ?
        id: touched
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            build=true
          else
            range=""
            if [ "$EVENT" = "pull_request" ]; then
              git fetch --quiet origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
              range="origin/$BASE_REF...$PR_HEAD"
            elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              range="$BEFORE..$GITHUB_SHA"
            else
              # Nouvelle branche : comparée à origin/main.
              range="origin/main...$GITHUB_SHA"
            fi
            # Un diff illisible compile par prudence.
            if ! files=$(git diff --name-only "$range"); then
              echo "::warning::Diff $range illisible : l'APK est compilé."
              build=true
            elif printf '%s\n' "$files" | grep -qE '^app/(pubspec\.(yaml|lock)$|android/)'; then
              build=true
            else
              build=false
            fi
          fi
          echo "Compilation Android : $build."
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Libérer de la place sur le disque
        # SDK Flutter, caches Gradle et build de l'APK remplissent le disque du
        # runner. Le SDK Android (/usr/local/lib/android) reste.
        if: steps.touched.outputs.build == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/julia* \
            /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft
          df -h /

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: steps.touched.outputs.build == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.touched.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: Dépendances
        if: steps.touched.outputs.build == 'true'
        working-directory: app
        run: flutter pub get

      - name: Asset des nouveautés
        if: steps.touched.outputs.build == 'true'
        run: node scripts/changelog-recent.mjs

      - name: Compiler l'APK release (clé jetable)
        # La clé de release reste réservée à deploy.yml (P8). Celle-ci est
        # générée ici, valable un jour, et supprimée à la sortie avec
        # key.properties.
        if: steps.touched.outputs.build == 'true'
        working-directory: app
        run: |
          keystore="$RUNNER_TEMP/ci-keystore.jks"
          properties="android/key.properties"
          trap 'rm -f "$keystore" "$properties"' EXIT
          password=$(openssl rand -hex 16)
          keytool -genkeypair -noprompt -keystore "$keystore" -alias ci \
            -keyalg RSA -keysize 2048 -validity 1 \
            -storepass "$password" -keypass "$password" -dname "CN=CI"
          {
            echo "storeFile=$keystore"
            echo "storePassword=$password"
            echo "keyAlias=ci"
            echo "keyPassword=$password"
          } > "$properties"
          flutter build apk --release
