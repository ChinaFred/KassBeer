include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    empty_catches: error
    unawaited_futures: error

linter:
  rules:
    - empty_catches
    - unawaited_futures
    - always_declare_return_types
    - avoid_dynamic_calls
    - only_throw_errors
    - prefer_final_fields
    - prefer_final_locals
    - public_member_api_docs
    - unnecessary_lambdas
